[project]
name = "grantsearch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "bm25s>=0.3.14",
    "fastapi>=0.149.0",
    "httpx>=0.28.1",
    "jellyfish>=1.3.0",
    "nicknames>=1.0.1",
    "pymupdf>=1.28.2",
    "pystemmer>=3.1.0",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
]

# Linux (the server) gets CPU-only torch; the default wheel pulls in CUDA.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
